name: CSV Value Change Alert

on:
  push:
    paths:
      - "data/fact/RI_1B1_gdp_growth.csv"

jobs:
  check-csv-change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Strip last_updated column from old and new CSV
        id: strip_timestamp
        run: |
          strip_col() {
            awk -F, '
              NR==1 {
                for (i=1; i<=NF; i++) if ($i == "last_updated") col=i
              }
              {
                out=""
                for (i=1; i<=NF; i++) {
                  if (i==col) continue
                  out = out (out=="" ? "" : ",") $i
                }
                print out
              }'
          }
          git show HEAD^:data/fact/RI_1B1_gdp_growth.csv | strip_col > old_novalue_ts.csv
          strip_col < data/fact/RI_1B1_gdp_growth.csv > new_novalue_ts.csv

      - name: Check if CSV values actually changed
        id: diff_check
        run: |
          if diff --brief old_novalue_ts.csv new_novalue_ts.csv > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save diff to file
        if: steps.diff_check.outputs.changed == 'true'
        run: |
          diff -u old_novalue_ts.csv new_novalue_ts.csv > csv_diff.txt || true

      - name: Open GitHub issue with diff
        if: steps.diff_check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('csv_diff.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "CSV values changed - tell Joe: RI_1B1_gdp_growth.csv",
              body: "```diff\n" + diff + "\n```",
              assignees: ['stevecrawshaw']
            });
